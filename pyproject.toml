[tool.poetry]
name = "cumulus-granule-to-cnm"
version = "0.2.3a0"
description = "Basic conversion from granule to cnm"
authors = ["Hong-Kit Randy Yeung <hong-kit.r.yeung@jpl.nasa.gov>"]

[tool.poetry.dependencies]
python = "^3.12"
cumulus-process = "^1.7.0"
podaac-cloud-notification-message-schema = "^1.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
moto = "^4.1.14"
pytest-cov = "^4.0.0"
pylint = "^2.17.4"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
